<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Safety GPS Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f8;
    text-align: center;
    color: #111;
    padding: 20px;
  }
  .card {
    max-width: 430px;
    margin: 20px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  h1 { margin: 5px 0 8px; }
  .sub { color: #666; margin-bottom: 20px; }
  #status {
    font-size: 34px;
    font-weight: bold;
    margin: 20px 0 10px;
  }
  #distance { font-size: 22px; font-weight: bold; }
  #accuracy, #coords, #updated {
    color: #666;
    margin-top: 10px;
    font-size: 14px;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 15px 25px;
    font-size: 17px;
    font-weight: bold;
    background: #222;
    color: white;
    margin-top: 18px;
  }
  .in { color: #159447; }
  .out { color: #d62828; }
  .warn { color: #e58a00; }
</style>
</head>

<body>
<div class="card">
  <h1>🎒 Student Safety</h1>
  <div class="sub">GPS School-Area Test</div>

  <div id="status" class="warn">📍 CHECKING...</div>

  <div id="distance">Waiting for GPS...</div>
  <div id="accuracy"></div>
  <div id="coords"></div>
  <div id="updated"></div>

  <button onclick="startGPS()">CHECK LOCATION</button>

  <p style="color:#777; margin-top:22px;">
    Test location: RoboHub<br>
    30.8527404, 75.8077217<br>
    Allowed radius: 200 metres
  </p>
</div>

<script>
const TARGET_LAT = 30.8527404;
const TARGET_LON = 75.8077217;
const RADIUS_METERS = 200;

let watchId = null;

function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const p1 = lat1 * Math.PI / 180;
  const p2 = lat2 * Math.PI / 180;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(p1) * Math.cos(p2) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function success(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  const accuracy = position.coords.accuracy;
  const distance = distanceMeters(lat, lon, TARGET_LAT, TARGET_LON);

  const status = document.getElementById("status");

  if (distance <= RADIUS_METERS) {
    status.textContent = "🟢 IN AREA";
    status.className = "in";
  } else {
    status.textContent = "🔴 OUT OF AREA";
    status.className = "out";
  }

  document.getElementById("distance").textContent =
    "Distance: " + Math.round(distance) + " m";

  document.getElementById("accuracy").textContent =
    "GPS accuracy: ±" + Math.round(accuracy) + " m";

  document.getElementById("coords").textContent =
    "Phone: " + lat.toFixed(6) + ", " + lon.toFixed(6);

  document.getElementById("updated").textContent =
    "Updated: " + new Date().toLocaleTimeString();
}

function error(err) {
  const status = document.getElementById("status");
  status.textContent = "⚠️ LOCATION ERROR";
  status.className = "warn";

  let message = "Unable to get location.";

  if (err.code === 1) {
    message = "Location permission denied. Allow location access for this website in iPhone Settings.";
  } else if (err.code === 2) {
    message = "Location unavailable. Turn on Location Services.";
  } else if (err.code === 3) {
    message = "GPS request timed out. Try again outdoors.";
  }

  document.getElementById("distance").textContent = message;
}

function startGPS() {
  if (!("geolocation" in navigator)) {
    document.getElementById("status").textContent = "❌ GPS NOT SUPPORTED";
    return;
  }

  document.getElementById("status").textContent = "📍 GETTING GPS...";
  document.getElementById("status").className = "warn";

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  watchId = navigator.geolocation.watchPosition(
    success,
    error,
    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 5000
    }
  );
}

window.addEventListener("load", startGPS);
</script>
</body>
</html>
